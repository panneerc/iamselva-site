<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iamselva — Markets, Stocks & Sports</title>
<meta name="description" content="Selva's desk: live market tickers, the top 100 US stocks, and headlines on markets, sports, Arsenal, CSK, Azure, India and Richmond.">
<meta property="og:title" content="iamselva — Markets, Stocks & Sports">
<meta property="og:description" content="Live market tickers, top 100 stocks and headlines, updated every few minutes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">
<script>
  // Apply saved theme before paint (no flash)
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  :root{
    --band:#14213D;      /* CSK navy */
    --band-2:#1D2F55;
    --yellow:#F9C80E;    /* CSK yellow */
    --yellow-ink:#2B2200;
    --red:#C8102E;       /* Arsenal red */
    --bg:#F2F4F8; --surface:#FFFFFF; --ink:#14213D; --muted:#5B6780; --line:#DCE1EA; --hover:#F7F8FB;
    --tv:"light";
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0D1526; --surface:#142038; --ink:#E8EEF8; --muted:#9AA8C2; --line:#22304D; --hover:#1A2844;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D1526; --surface:#142038; --ink:#E8EEF8; --muted:#9AA8C2; --line:#22304D; --hover:#1A2844;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .2s}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:6px}
  .wrap{max-width:1200px;margin:0 auto;padding-left:16px;padding-right:16px}

  /* ---------- Navy band: wordmark, ticker, tabs ---------- */
  .band{background:var(--band);color:#fff}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:22px;padding-bottom:14px}
  .mark{display:flex;align-items:baseline;gap:2px;font-weight:800;font-size:clamp(30px,5vw,44px);letter-spacing:-1.5px;line-height:1}
  .mark .sq{width:.42em;height:.42em;background:var(--yellow);border-radius:3px;margin-right:10px;align-self:center;transform:rotate(8deg)}
  .mark .tld{color:#8FA3C8;font-weight:600}
  .tools{display:flex;align-items:center;gap:14px;font-size:13px;color:#B9C6DE}
  .live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--yellow);margin-right:7px;vertical-align:1px}
  @media (prefers-reduced-motion:no-preference){ .live{animation:pulse 2.4s ease-in-out infinite} }
  @keyframes pulse{50%{opacity:.35}}
  .theme-btn{white-space:nowrap;font:inherit;font-size:13px;font-weight:600;color:#fff;background:var(--band-2);border:1px solid #2E4373;border-radius:999px;padding:7px 14px;cursor:pointer}
  .theme-btn:hover{border-color:var(--yellow)}
  @media(max-width:560px){ .stamp{display:none} }
  .tape{min-height:46px;border-top:1px solid #22355E}
  nav{position:sticky;top:0;z-index:5;background:var(--band);border-top:1px solid #22355E;box-shadow:0 6px 18px -12px rgba(0,0,0,.6)}
  .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;font:inherit;font-size:15px;font-weight:600;color:#C9D4EA;background:none;border:0;border-radius:10px;padding:9px 15px;cursor:pointer}
  .tab:hover{color:#fff;background:var(--band-2)}
  .tab.on{color:var(--yellow-ink);background:var(--yellow)}

  /* ---------- Page ---------- */
  main.wrap{padding-top:30px;padding-bottom:56px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  h1{font-size:clamp(30px,4.4vw,42px);font-weight:800;letter-spacing:-1.2px;margin:0;line-height:1.05}
  .sub{color:var(--muted);font-size:15px;margin-top:6px}
  input[type=search]{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;width:260px;max-width:100%}
  input[type=search]::placeholder{color:var(--muted)}

  .split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:start}
  @media(max-width:920px){.split{grid-template-columns:minmax(0,1fr)}}
  .narrow{max-width:820px}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .panel-title{font-size:17px;font-weight:700;padding:16px 18px 4px}
  .panel-note{font-size:14px;color:var(--muted);padding:0 18px 12px}

  /* Headlines: a list, not cards */
  .news{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .news li + li{border-top:1px solid var(--line)}
  .news a{display:block;padding:16px 20px;border-left:4px solid transparent;transition:background .15s,border-color .15s}
  .news a:hover{background:var(--hover);border-left-color:var(--yellow)}
  .meta{font-size:13px;color:var(--muted);margin-bottom:5px}
  .meta b{color:var(--ink);font-weight:600}
  .t{font-family:Newsreader,Georgia,serif;font-size:20px;font-weight:600;line-height:1.3;letter-spacing:-.1px}
  .s{font-family:Newsreader,Georgia,serif;font-size:16px;line-height:1.55;color:var(--muted);margin-top:5px;max-width:68ch}
  .empty{padding:28px 20px;color:var(--muted);font-size:15px}

  .tv-overview{height:560px}
  .tv-heat{height:560px}
  .tv-screen{height:760px}
  .stack{display:grid;gap:24px}

  footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.7;padding-top:22px;padding-bottom:44px}
</style>
</head>
<body>
<div class="band">
  <header class="wrap top">
    <a class="mark" href="#markets" aria-label="iamselva.com home"><span class="sq"></span>iamselva<span class="tld">.com</span></a>
    <div class="tools">
      <span class="stamp"><span class="live"></span><span id="updated">Loading…</span></span>
      <button class="theme-btn" id="themeBtn" type="button">Dark mode</button>
    </div>
  </header>
  <!-- Live ticker tape (TradingView free widget). Edit WATCHLIST below to change symbols. -->
  <div class="tape" id="tape"></div>
</div>

<nav aria-label="Sections"><div class="wrap tabs" id="tabs"></div></nav>

<main class="wrap">
  <div class="head">
    <div><h1 id="title">Markets</h1><div class="sub" id="subtitle"></div></div>
    <input type="search" id="q" placeholder="Filter headlines" aria-label="Filter headlines">
  </div>
  <div id="view"></div>
</main>

<footer>
  <div class="wrap">
    Headlines link to the original publishers; all articles belong to them. Market data and charts by TradingView.
    Nothing here is financial advice.<br>
    © <span id="yr"></span> iamselva.com
  </div>
</footer>

<script>
// ---------- Settings you can edit ----------
const WATCHLIST = [
  { proName: "FOREXCOM:SPXUSD", title: "S&P 500" },
  { proName: "FOREXCOM:NSXUSD", title: "Nasdaq 100" },
  { proName: "FOREXCOM:DJI",    title: "Dow 30" },
  { proName: "AMEX:SPY",        title: "SPY" },
  { proName: "NASDAQ:QQQ",      title: "QQQ" },
  { proName: "NASDAQ:MSFT",     title: "Microsoft" },
  { proName: "NASDAQ:NVDA",     title: "Nvidia" },
  { proName: "NASDAQ:AAPL",     title: "Apple" },
  { proName: "NASDAQ:TSLA",     title: "Tesla" },
  { proName: "BITSTAMP:BTCUSD", title: "Bitcoin" },
  { proName: "FX_IDC:USDINR",   title: "USD/INR" }
];
// Tabs that show live stock widgets instead of headlines. Inserted after "Markets".
const STOCKS_TAB = { id: "stocks", title: "Top 100 Stocks" };
const REFRESH_MINUTES = 5;
// --------------------------------------------

const $ = s => document.querySelector(s);
const root = document.documentElement;
$("#yr").textContent = new Date().getFullYear();

function isDark() {
  const t = root.dataset.theme;
  if (t) return t === "dark";
  return window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function syncThemeBtn() { $("#themeBtn").textContent = isDark() ? "Light mode" : "Dark mode"; }
$("#themeBtn").onclick = () => {
  const next = isDark() ? "light" : "dark";
  root.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch (e) {}
  syncThemeBtn(); render();
};
syncThemeBtn();

function tvWidget(el, name, config) {
  if (!el) return;
  const box = document.createElement("div");
  box.className = "tradingview-widget-container";
  box.style.height = "100%";
  box.innerHTML = '<div class="tradingview-widget-container__widget" style="height:100%"></div>';
  const s = document.createElement("script");
  s.src = `https://s3.tradingview.com/external-embedding/embed-widget-${name}.js`;
  s.async = true;
  s.innerHTML = JSON.stringify(config);
  box.appendChild(s);
  el.innerHTML = "";
  el.appendChild(box);
}

// Ticker sits on the navy band, so it always uses the dark widget theme
tvWidget($("#tape"), "ticker-tape", {
  symbols: WATCHLIST, showSymbolLogo: true, isTransparent: true,
  displayMode: "adaptive", colorTheme: "dark", locale: "en"
});

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
function ago(iso) {
  if (!iso) return "";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  if (m < 1440) return Math.round(m / 60) + " hr ago";
  return Math.round(m / 1440) + " days ago";
}

let NEWS = null, TABS = [], current = "markets";

function newsList(items, q) {
  const f = q ? items.filter(i => (i.title + " " + i.summary + " " + i.source).toLowerCase().includes(q)) : items;
  if (!f.length) return `<div class="news"><div class="empty">${q ? "No headlines match that filter. Clear the box to see everything." : "New headlines arrive within a few minutes. Check back shortly."}</div></div>`;
  return `<ul class="news">${f.map(i => `
    <li><a href="${esc(i.link)}" target="_blank" rel="noopener">
      <div class="meta"><b>${esc(i.source || "News")}</b>, ${ago(i.published)}</div>
      <div class="t">${esc(i.title)}</div>
      ${i.summary ? `<div class="s">${esc(i.summary)}</div>` : ""}
    </a></li>`).join("")}</ul>`;
}

let builtKey = null;

function render() {
  const theme = isDark() ? "dark" : "light";
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.id === current));
  document.querySelector(".tab.on")?.scrollIntoView({ block: "nearest", inline: "nearest" });
  const key = current + "|" + theme;
  if (key !== builtKey) { build(theme); builtKey = key; }
  updateList();
}

// Builds the page layout and widgets (only when the tab or theme changes)
function build(theme) {
  if (current === STOCKS_TAB.id) {
    $("#title").textContent = STOCKS_TAB.title;
    $("#subtitle").textContent = "The largest US companies by market value, live during market hours.";
    $("#q").hidden = true;
    $("#view").innerHTML = `<div class="stack">
      <section class="panel"><div class="panel-title">S&amp;P 500 heat map</div>
        <div class="panel-note">Box size is company value; color is today’s move. Click a sector to zoom in.</div>
        <div class="tv-heat" id="heat"></div></section>
      <section class="panel"><div class="panel-title">Biggest US stocks</div>
        <div class="panel-note">Sorted by market value. Click any column to re-sort, or use the page arrows at the bottom to see all 100+.</div>
        <div class="tv-screen" id="screen"></div></section>
    </div>`;
    tvWidget($("#heat"), "stock-heatmap", {
      dataSource: "SPX500", grouping: "sector", blockSize: "market_cap_basic", blockColor: "change",
      locale: "en", colorTheme: theme, hasTopBar: true, isDataSetEnabled: false, isZoomEnabled: true,
      hasSymbolTooltip: true, isMonoSize: false, isTransparent: true, width: "100%", height: "100%"
    });
    tvWidget($("#screen"), "screener", {
      width: "100%", height: "100%", defaultColumn: "overview", defaultScreen: "most_capitalized",
      market: "america", showToolbar: true, colorTheme: theme, locale: "en", isTransparent: true
    });
    return;
  }

  $("#q").hidden = false;
  if (current === "markets") {
    $("#view").innerHTML = `<div class="split"><div id="list"></div>
      <section class="panel"><div class="panel-title">Market overview</div><div class="tv-overview" id="tv"></div></section></div>`;
    tvWidget($("#tv"), "market-overview", {
      colorTheme: theme, dateRange: "1D", showChart: true, locale: "en", isTransparent: true,
      width: "100%", height: "100%", showSymbolLogo: true,
      plotLineColorGrowing: "#16A34A", plotLineColorFalling: "#C8102E",
      tabs: [
        { title: "Indices", symbols: [{ s: "FOREXCOM:SPXUSD", d: "S&P 500" }, { s: "FOREXCOM:NSXUSD", d: "Nasdaq 100" }, { s: "FOREXCOM:DJI", d: "Dow 30" }, { s: "INDEX:NKY", d: "Nikkei 225" }, { s: "BSE:SENSEX", d: "Sensex" }] },
        { title: "My stocks", symbols: WATCHLIST.filter(w => /NASDAQ|NYSE|AMEX/.test(w.proName)).map(w => ({ s: w.proName, d: w.title })) },
        { title: "FX & crypto", symbols: [{ s: "FX_IDC:USDINR", d: "USD/INR" }, { s: "FX:EURUSD", d: "EUR/USD" }, { s: "BITSTAMP:BTCUSD", d: "Bitcoin" }, { s: "BITSTAMP:ETHUSD", d: "Ethereum" }] }
      ]
    });
  } else {
    $("#view").innerHTML = `<div class="narrow" id="list"></div>`;
  }
}

// Fills in the headlines (runs on filter typing and on background refresh)
function updateList() {
  const el = $("#list");
  if (!el) return;
  const q = $("#q").value.trim().toLowerCase();
  const sec = NEWS?.sections?.[current] || { title: current, items: [] };
  $("#title").textContent = sec.title;
  $("#subtitle").textContent = sec.items.length ? `${sec.items.length} headlines from ${sec.feeds_ok || "several"} sources` : "";
  el.innerHTML = newsList(sec.items, q);
}

function go(id) {
  current = id;
  if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
  render();
}

async function load() {
  try { NEWS = await (await fetch("data/news.json?t=" + Date.now())).json(); } catch { NEWS = { order: [], sections: {} }; }
  const order = (NEWS.order?.length ? NEWS.order : ["markets", "sports", "teams", "tech", "india", "richmond"])
    .filter(id => NEWS.sections?.[id] || !NEWS.order?.length);
  TABS = order.map(id => ({ id, title: NEWS.sections?.[id]?.title || id }));
  TABS.splice(TABS.findIndex(t => t.id === "markets") + 1, 0, STOCKS_TAB);
  $("#tabs").innerHTML = TABS.map(t => `<button class="tab" type="button" data-id="${t.id}">${esc(t.title)}</button>`).join("");
  $("#tabs").onclick = e => { const b = e.target.closest(".tab"); if (b) go(b.dataset.id); };
  $("#updated").textContent = NEWS.updated ? "Updated " + ago(NEWS.updated) : "Waiting for first update";

  const want = location.hash.slice(1);
  const ids = TABS.map(t => t.id);
  if (ids.includes(want)) current = want;
  else if (!ids.includes(current)) current = ids[0];
  render();
}

$("#q").addEventListener("input", updateList);
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (id && id !== current && TABS.some(t => t.id === id)) go(id); });
window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { if (!root.dataset.theme) { syncThemeBtn(); render(); } });
load();
setInterval(load, REFRESH_MINUTES * 60 * 1000);
</script>
</body>
</html>
