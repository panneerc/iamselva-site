name: Update headlines and publish site

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (UTC)
  workflow_dispatch:         # lets you click "Run workflow" by hand
    inputs:
      force_odds:
        description: "Fetch odds now even if they are fresh (uses free API credits)"
        type: boolean
        default: false
  push:
    branches: [main]         # any edit you make re-publishes the site

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install feedparser requests

      - name: Fetch headlines and odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FORCE_ODDS: ${{ github.event.inputs.force_odds == 'true' && '1' || '' }}
        run: python scripts/fetch_news.py

      - name: Save latest data to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update headlines $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Package site
        run: |
          mkdir _site
          cp -r index.html CNAME data _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
